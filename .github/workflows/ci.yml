name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afm
          POSTGRES_USER: afm
          POSTGRES_PASSWORD: afm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afm -d afm"
          --health-interval=10s
          --timeout=5s
          --retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://afm:afm@localhost:5432/afm
      JWT_SECRET: afm-ci-jwt-secret-must-be-at-least-32-characters
      CSRF_SECRET: afm-ci-csrf-secret-must-be-at-least-32-characters
      FRONTEND_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Ruff format check
        run: python -m ruff format --check backend

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q --cov-report=xml:coverage.xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  e2e:
    name: PostgreSQL browser journey
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afm
          POSTGRES_USER: afm
          POSTGRES_PASSWORD: afm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afm -d afm"
          --health-interval=10s
          --timeout=5s
          --retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://afm:afm@localhost:5432/afm
      JWT_SECRET: afm-ci-jwt-secret-must-be-at-least-32-characters
      CSRF_SECRET: afm-ci-csrf-secret-must-be-at-least-32-characters
      FRONTEND_ORIGINS: http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      E2E_USERNAME: e2e-operator
      E2E_PASSWORD: e2e-test-password-12345
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Create test administrator
        run: >-
          python -m backend.app.cli create-admin
          --username "$E2E_USERNAME"
          --password "$E2E_PASSWORD"

      - name: Start API
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/afm-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/afm-api.log
          exit 1

      - name: Run PostgreSQL browser journey
        working-directory: frontend
        run: npm run test:e2e
