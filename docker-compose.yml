services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afm}
      POSTGRES_USER: ${POSTGRES_USER:-afm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afm} -d ${POSTGRES_DB:-afm}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-afm}
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]
volumes:
  postgres_data:
