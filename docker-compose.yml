services:
  postgres:
    image: postgres:16-alpine
    container_name: afm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: afm
      POSTGRES_USER: afm_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - afm-postgres-data:/var/lib/postgresql/data
volumes:
  afm-postgres-data:
